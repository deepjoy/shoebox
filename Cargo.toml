[package]
name = "shoebox"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lightweight S3-compatible object storage backed by local filesystem"
repository = "https://github.com/shoebox/shoebox"
keywords = ["s3", "storage", "object-storage", "aws"]
categories = ["filesystem", "web-programming::http-server", "api-bindings"]
readme = "README.md"

[lib]
name = "shoebox"
path = "src/lib.rs"

[[bin]]
name = "shoebox"
path = "src/main.rs"

[features]
default = ["binary"]
binary = ["clap"]

[dependencies]
# Core async runtime
tokio = { version = "1.44", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Cryptography
md-5 = "0.10"
hex = "0.4"

# Utilities
uuid = { version = "1.11", features = ["v4"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
thiserror = "2.0"
bytes = "1.9"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"

# CLI (optional for library-only usage)
clap = { version = "4.5", features = ["derive", "env"], optional = true }

[dev-dependencies]
tempfile = "3"
